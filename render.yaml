# Render blueprint for PickSportPlus.
#
# One free web service and nothing else. Nothing here costs money by itself.
#
# STORAGE. DATABASE_URL below is deliberately left blank with sync: false, so Render prompts
# for a real value at deploy time instead of silently defaulting to a disposable file. A
# real league, with real players and real money on the line, needs a persistent database:
# create one for free at https://neon.tech and paste its connection string in as
# DATABASE_URL. SQLite on the instance's own disk (sqlite:////tmp/picksportplus.db) is
# demo-only. That disk is ephemeral: when the free service sleeps or redeploys, the file is
# lost, and the start command rebuilds a fresh demo from the recordings in tests/fixtures.
# That is exactly right for a throwaway public demo, and exactly wrong for a real pool: every
# account, league, pick, payout rule and award a real league creates would be lost the same
# way. See DECISIONS.md, "Remediation, August 2026", and README.md, "Persistent database
# (Neon)". The app itself also warns loudly, both at boot (the server log) and in the site
# admin's dashboard, whenever it detects it is running on this ephemeral path.
#
# There is deliberately NO cron job. Render's free plan does not offer them, and this demo
# runs entirely on seeded historical data, so it needs no scheduled work. Live weekly
# automation (auto slate, live scores, scoring) is the `run-cron` command and can be enabled
# later on a paid plan or driven from any external scheduler. See the README.
#
# The demo makes zero outbound API calls. OFFLINE_MODE blocks the network at the HTTP layer,
# and the seeded week is replayed from JSON recorded in tests/fixtures, so it needs no keys
# and spends no metered credits. Turn OFFLINE_MODE off once a real DATABASE_URL and real
# provider keys are in place for an actual season.

services:
  - type: web
    name: picksportplus
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Migrate, seed, then serve. Every step is idempotent, so a redeploy or a restart after
    # the free service sleeps repeats it harmlessly.
    #   - alembic upgrade head   brings an empty database up to the current schema
    #   - seed-admin             no-ops unless ADMIN_EMAIL and ADMIN_PASSWORD are both set
    #   - seed-demo              no-ops once the demo pool exists
    # proxy-headers plus forwarded-allow-ips lets uvicorn trust Render's X-Forwarded-Proto,
    # which is what makes the app see HTTPS and set a Secure session cookie.
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli seed-admin &&
      python -m app.cli seed-demo &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Left for Render to prompt for at deploy time. Paste in a Neon (or any Postgres)
      # connection string for a real league. Only use sqlite:////tmp/picksportplus.db for a
      # throwaway demo, see the note at the top of this file: that path is wiped on every
      # sleep or redeploy.
      - key: DATABASE_URL
        sync: false
      # Generated by Render. Nobody has to paste anything.
      - key: SECRET_KEY
        generateValue: true

      # Keep the demo sealed off from the paid feeds. Flip to false only if you later add
      # keys and want live data.
      - key: OFFLINE_MODE
        value: "true"

      - key: SEASON_YEAR
        value: "2026"
      - key: TIMEZONE
        value: America/New_York
      # Strangers must not be able to register on a public demo.
      - key: OPEN_REGISTRATION
        value: "false"
      - key: ODDS_API_MONTHLY_BUDGET
        value: "400"
      - key: CFBD_MONTHLY_BUDGET
        value: "800"
      - key: NUM_GAMES_PER_WEEK
        value: "20"
      - key: NFL_GAMES_PER_WEEK
        value: "8"
      - key: NCAAF_GAMES_PER_WEEK
        value: "12"
      - key: OPERATOR_NAME
        value: Spencer Innovations
      - key: OPERATOR_URL
        value: https://spencerinv.com

      # All optional. The demo runs fine with every one of these left blank.
      # Set ADMIN_EMAIL and ADMIN_PASSWORD together if you want your own commissioner
      # account in addition to the demo one.
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_JOIN_CODE
        sync: false
      # Published on the terms and privacy pages. Left blank those pages say to contact
      # your pool commissioner instead of showing an address.
      - key: CONTACT_EMAIL
        sync: false

