# Render blueprint for the free PickSportPlus demo.
#
# One free web service and nothing else. Nothing here costs money.
#
# STORAGE. This blueprint deliberately does NOT create a Render Postgres, because Render
# allows only one free tier database per workspace and this account's free slot is already
# taken by a live app. The demo therefore runs on SQLite on the instance's own disk.
#
# That disk is ephemeral. When the free service sleeps or redeploys, the file is lost and
# the start command rebuilds the whole demo from the recordings in tests/fixtures. The
# seeded week, the standings and both demo logins are always there, so the demo always
# looks right. What does not survive a restart is anything a visitor typed themselves,
# such as picks they made while looking around.
#
# To make it permanent, and still free: create a database at https://neon.tech, then set
# DATABASE_URL on this service to the Neon connection string. That is the only change
# needed. Neon's free tier does not expire, unlike Render's 30 day free Postgres.
#
# There is deliberately NO cron job. Render's free plan does not offer them, and this demo
# runs entirely on seeded historical data, so it needs no scheduled work. Live weekly
# automation (auto slate, live scores, scoring) is the `run-cron` command and can be enabled
# later on a paid plan or driven from any external scheduler. See the README.
#
# The demo makes zero outbound API calls. OFFLINE_MODE blocks the network at the HTTP layer,
# and the seeded week is replayed from JSON recorded in tests/fixtures, so it needs no keys
# and spends no metered credits.

services:
  - type: web
    name: picksportplus
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Migrate, seed, then serve. Every step is idempotent, so a redeploy or a restart after
    # the free service sleeps repeats it harmlessly.
    #   - alembic upgrade head   brings an empty database up to the current schema
    #   - seed-admin             no-ops unless ADMIN_EMAIL and ADMIN_PASSWORD are both set
    #   - seed-demo              no-ops once the demo pool exists
    # proxy-headers plus forwarded-allow-ips lets uvicorn trust Render's X-Forwarded-Proto,
    # which is what makes the app see HTTPS and set a Secure session cookie.
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli seed-admin &&
      python -m app.cli seed-demo &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # SQLite on the instance disk. Replace this value with a Neon connection string to
      # make the demo persistent, see the note at the top of this file. /tmp is chosen
      # because it is always writable on a Render instance.
      - key: DATABASE_URL
        value: sqlite:////tmp/picksportplus.db
      # Generated by Render. Nobody has to paste anything.
      - key: SECRET_KEY
        generateValue: true

      # Keep the demo sealed off from the paid feeds. Flip to false only if you later add
      # keys and want live data.
      - key: OFFLINE_MODE
        value: "true"

      - key: SEASON_YEAR
        value: "2026"
      - key: TIMEZONE
        value: America/New_York
      # Strangers must not be able to register on a public demo.
      - key: OPEN_REGISTRATION
        value: "false"
      - key: ODDS_API_MONTHLY_BUDGET
        value: "400"
      - key: CFBD_MONTHLY_BUDGET
        value: "800"
      - key: NUM_GAMES_PER_WEEK
        value: "20"
      - key: NFL_GAMES_PER_WEEK
        value: "8"
      - key: NCAAF_GAMES_PER_WEEK
        value: "12"
      - key: OPERATOR_NAME
        value: Spencer Innovations
      - key: OPERATOR_URL
        value: https://spencerinv.com

      # All optional. The demo runs fine with every one of these left blank.
      # Set ADMIN_EMAIL and ADMIN_PASSWORD together if you want your own commissioner
      # account in addition to the demo one.
      - key: ODDS_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_JOIN_CODE
        sync: false
      # Published on the terms and privacy pages. Left blank those pages say to contact
      # your pool commissioner instead of showing an address.
      - key: CONTACT_EMAIL
        sync: false

